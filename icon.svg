<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="tile"><rect width="128" height="128" rx="22"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05061a"/>
      <stop offset="1" stop-color="#1b1d4d"/>
    </linearGradient>
    <radialGradient id="mars" cx="0.35" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#f08a4b"/>
      <stop offset="0.55" stop-color="#c1440e"/>
      <stop offset="1" stop-color="#7a2408"/>
    </radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262c6b"/>
      <stop offset="0.65" stop-color="#10143a"/>
      <stop offset="1" stop-color="#7a2f1a"/>
    </linearGradient>
    <radialGradient id="shell" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c0e0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="128" height="128" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#ffffff">
      <circle cx="14" cy="16" r="1.4"/>
      <circle cx="104" cy="12" r="1.2"/>
      <circle cx="116" cy="44" r="1.6"/>
      <circle cx="10" cy="52" r="1"/>
      <circle cx="30" cy="30" r="0.9" opacity="0.7"/>
      <circle cx="92" cy="30" r="0.9" opacity="0.7"/>
      <circle cx="120" cy="76" r="0.9" opacity="0.7"/>
    </g>

    <!-- Mars horizon -->
    <ellipse cx="64" cy="158" rx="104" ry="64" fill="url(#mars)"/>
    <ellipse cx="30" cy="112" rx="9" ry="3.2" fill="#8f2f0b" opacity="0.7"/>
    <ellipse cx="98" cy="108" rx="7" ry="2.6" fill="#8f2f0b" opacity="0.7"/>
    <ellipse cx="78" cy="122" rx="11" ry="3.4" fill="#8f2f0b" opacity="0.6"/>

    <!-- helmet -->
    <rect x="46" y="84" width="36" height="12" rx="5" fill="#8c94c8"/>
    <circle cx="64" cy="56" r="36" fill="url(#shell)" stroke="#6b74b8" stroke-width="3"/>
    <rect x="35" y="35" width="58" height="42" rx="21" fill="url(#visor)" stroke="#4a5199" stroke-width="2.5"/>
    <!-- visor shine -->
    <path d="M45 48 q4 -9 15 -10" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
    <circle cx="48" cy="57" r="1.6" fill="#ffffff" opacity="0.7"/>
    <!-- tiny Mars reflection -->
    <ellipse cx="64" cy="73" rx="14" ry="3" fill="#e0642a" opacity="0.75"/>
    <!-- antenna -->
    <rect x="93" y="30" width="3" height="16" rx="1.5" fill="#8c94c8" transform="rotate(25 94.5 38)"/>
    <circle cx="101" cy="25" r="3.2" fill="#ff5a4a"/>
  </g>
  <rect x="1.5" y="1.5" width="125" height="125" rx="20.5" fill="none" stroke="#6b74b8" stroke-width="3" opacity="0.8"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
